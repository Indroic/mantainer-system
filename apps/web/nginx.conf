server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    add_header X-App "mantainer-web-spa" always;

    # Tamaño máximo de cuerpo para uploads/peticiones grandes hacia el backend.
    client_max_body_size 25m;

    # Resolver DNS embebido de Docker: permite resolver los nombres de los
    # contenedores (auth-server, backend) en tiempo de ejecución, de modo que
    # nginx arranque aunque esos servicios todavía no estén levantados.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # PROXY INVERSO (mismo origen) — elimina CORS y cookies cross-subdominio.
    #   /api/auth/*    -> auth-server (Better Auth)
    #   /trpc/*        -> auth-server (tRPC)
    #   /create-admin  -> auth-server (alta de admin con clave)
    #   /api/*         -> backend (FastAPI REST)
    #   resto          -> SPA estática
    # Nota: entre prefijos `^~`, nginx elige el más largo, por lo que
    # /api/auth/ tiene prioridad sobre /api/ para las rutas de auth.
    # =========================================================================

    # ----- Better Auth (sesiones, JWT, sign-in, etc.) -----
    location ^~ /api/auth/ {
        set $auth_upstream http://auth-server:3000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ----- tRPC (servido por el auth-server) -----
    location ^~ /trpc/ {
        set $auth_upstream http://auth-server:3000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ----- Alta de administrador (clave de creación) -----
    location = /create-admin {
        set $auth_upstream http://auth-server:3000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ----- Backend FastAPI (REST de negocio) -----
    location ^~ /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Fallback para HTML viejo cacheado que referencia hashes anteriores
    location ~ ^/assets/index-.*\.js$ {
        return 302 /assets/index.js;
    }

    location ~ ^/assets/index-.*\.css$ {
        return 302 /assets/index.css;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}
