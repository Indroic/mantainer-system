server {
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    add_header X-App "mantainer-web-spa" always;

    # Fallback para HTML viejo cacheado que referencia hashes anteriores
    location ~ ^/assets/index-.*\.js$ {
        return 302 /assets/index.js;
    }

    location ~ ^/assets/index-.*\.css$ {
        return 302 /assets/index.css;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}