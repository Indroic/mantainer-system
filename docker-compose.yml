version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: sgmm_auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgmm_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Tarea de un solo disparo para ejecutar las migraciones de Better Auth (Drizzle)
  auth-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    container_name: auth-migrate
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
    networks:
      - dokploy-network
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Tarea de un solo disparo para ejecutar las migraciones de la API FastAPI (Alembic)
  backend-migrate:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: backend-migrate
    environment:
      - SQL_DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - ASYNC_SQL_DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
    networks:
      - dokploy-network
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auth-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: auth-server
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - BETTER_AUTH_SECRET=better_auth_secret_32_characters_long_key
      - BETTER_AUTH_URL=http://localhost
    networks:
      - dokploy-network
    restart: always
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=8000
      - SQL_DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - ASYNC_SQL_DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - BETTER_AUTH_URL=http://auth-server:3000
      - JWKS_URL=http://auth-server:3000/api/auth/jwks
    networks:
      - dokploy-network
    restart: always
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      auth-server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    environment:
      - VITE_API_URL=http://localhost
      - VITE_AUTH_URL=http://localhost
    networks:
      - dokploy-network
    restart: always
    depends_on:
      - backend
      - auth-server

volumes:
  postgres_data:
    name: sgmm_postgres_data_prod

networks:
  dokploy-network:
    name: dokploy-network
