version: '3.8'

services:
  # Tarea de un solo disparo para ejecutar las migraciones de Better Auth (Drizzle)
  auth-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    container_name: auth-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatorio}
    networks:
      - dokploy-network
    restart: "no"

  # Tarea de un solo disparo para ejecutar las migraciones de la API FastAPI (Alembic)
  backend-migrate:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: backend-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatorio}
    networks:
      - dokploy-network
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  auth-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: auth-server
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatorio}
      - BETTER_AUTH_SECRET=better_auth_secret_32_characters_long_key
      - BETTER_AUTH_URL=http://localhost
    networks:
      - dokploy-network
    restart: always
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatorio}
      - BETTER_AUTH_URL=http://auth-server:3000
      - JWKS_URL=http://auth-server:3000/api/auth/jwks
    networks:
      - dokploy-network
    restart: always
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      auth-server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    environment:
      - VITE_API_URL=http://localhost
      - VITE_AUTH_URL=http://localhost
    networks:
      - dokploy-network
    restart: always
    depends_on:
      - backend
      - auth-server

networks:
  dokploy-network:
    name: dokploy-network
