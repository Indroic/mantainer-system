version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    environment:
      - VITE_AUTH_URL=http://auth-server:3000
      - VITE_API_URL=http://backend:8000
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    name: dokploy-network
