version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_AUTH_URL=${VITE_AUTH_URL}
    container_name: web
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    name: dokploy-network
