version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # HARDCODEADO (prototipo). En realidad no se usan en runtime: el frontend
      # apunta al mismo origen vía el proxy inverso de nginx (URLs fijadas en el
      # código). Se dejan por compatibilidad con inject-env.sh.
      - VITE_API_URL=https://sgmm.indroic.dev
      - VITE_AUTH_URL=https://sgmm.indroic.dev
    container_name: web
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    name: dokploy-network
