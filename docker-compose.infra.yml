version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: sgmm_auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgmm_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: sgmm_postgres_data

networks:
  dokploy-network:
    external: true
    name: dokploy-network
