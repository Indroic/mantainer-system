version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      # Fuente de verdad de las credenciales de Postgres. Si las defines en
      # Dokploy (nivel proyecto), todos los servicios deben usar el MISMO valor.
      # OJO: POSTGRES_PASSWORD solo se aplica en la PRIMERA inicialización del
      # volumen; si el volumen ya existía con otra clave, hay que resetearla o
      # recrear el volumen (ver instrucciones de despliegue).
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgmm_auth_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------
  # PGADMIN WEB (OPCIONAL / COMPOST COMPLETO PARA REVISIÓN DE LA BD)
  # Instrucciones: Si necesitas inspeccionar visualmente tu base de datos,
  # simplemente descomenta esta sección. PgAdmin se levantará de forma interna 
  # en el puerto 80 del contenedor, y puedes asignarle un puerto público o dominio en Dokploy.
  # ----------------------------------------------------------------------
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@sgmm.com
  #     PGADMIN_DEFAULT_PASSWORD: admin_secure_password_123
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - dokploy-network
  #   depends_on:
  #     - postgres
  #   restart: always

volumes:
  postgres_data:
    name: sgmm_postgres_data

networks:
  dokploy-network:
    name: dokploy-network
