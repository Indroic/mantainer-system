version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      # Credenciales HARDCODEADAS (prototipo). Deben coincidir EXACTAMENTE con las
      # URLs de conexión de auth-server, backend y los jobs de migración.
      # OJO: POSTGRES_PASSWORD solo se aplica al CREAR el volumen por primera vez;
      # si el volumen ya existía con otra clave, hay que recrearlo.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: sgmm_auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgmm_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------
  # PGADMIN WEB (OPCIONAL / COMPOST COMPLETO PARA REVISIÓN DE LA BD)
  # Instrucciones: Si necesitas inspeccionar visualmente tu base de datos,
  # simplemente descomenta esta sección. PgAdmin se levantará de forma interna 
  # en el puerto 80 del contenedor, y puedes asignarle un puerto público o dominio en Dokploy.
  # ----------------------------------------------------------------------
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@sgmm.com
  #     PGADMIN_DEFAULT_PASSWORD: admin_secure_password_123
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - dokploy-network
  #   depends_on:
  #     - postgres
  #   restart: always

volumes:
  postgres_data:
    # Volumen NUEVO (v2): fuerza una inicialización limpia de Postgres con la clave
    # hardcodeada (postgres_secure_password). El volumen antiguo `sgmm_postgres_data`
    # se había creado con otra contraseña y `POSTGRES_PASSWORD` no reescribe un
    # volumen ya inicializado, de ahí el error 28P01. Al cambiar el nombre, Docker
    # crea uno vacío y la clave del compose aplica desde cero.
    name: sgmm_postgres_data_v2

networks:
  dokploy-network:
    name: dokploy-network
