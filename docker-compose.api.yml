version: '3.8'

services:
  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT=8000
      - SQL_DATABASE_URL=postgresql://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - ASYNC_SQL_DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_password@postgres:5432/sgmm_auth_db
      - BETTER_AUTH_URL=http://auth-server:3000
      - JWKS_URL=http://auth-server:3000/api/auth/jwks
    ports:
      - "8000:8000"
    networks:
      - dokploy-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dokploy-network:
    external: true
    name: dokploy-network
